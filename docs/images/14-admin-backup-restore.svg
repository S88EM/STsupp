<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad14" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="cardGrad14" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="shadow14" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="900" height="520" fill="url(#bgGrad14)"/>
  <rect x="20" y="20" width="860" height="480" rx="14" fill="none" stroke="#334155" stroke-width="1.5"/>

  <!-- Window Header -->
  <path d="M 20 34 A 14 14 0 0 1 34 20 L 866 20 A 14 14 0 0 1 880 34 L 880 58 L 20 58 Z" fill="#1e293b"/>
  <circle cx="45" cy="39" r="5" fill="#ef4444"/>
  <circle cx="62" cy="39" r="5" fill="#f59e0b"/>
  <circle cx="79" cy="39" r="5" fill="#10b981"/>
  <text x="450" y="43" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">STsup — Резервне копіювання (.stsup) та безпечне відновлення бази даних</text>

  <!-- LEFT PANE: BACKUP EXPORT -->
  <g transform="translate(40, 75)">
    <rect width="380" height="400" rx="12" fill="url(#cardGrad14)" stroke="#334155" stroke-width="1.5" filter="url(#shadow14)"/>
    <path d="M 0 12 A 12 12 0 0 1 12 0 L 368 0 A 12 12 0 0 1 380 12 L 380 36 L 0 36 Z" fill="#1e293b"/>
    <text x="16" y="23" fill="#10b981" font-family="sans-serif" font-size="12" font-weight="bold">ЕКСПОРТ РЕЗЕРВНОЇ КОПІЇ (.stsup)</text>

    <!-- Description -->
    <text x="20" y="65" fill="#f8fafc" font-family="sans-serif" font-size="12" font-weight="600">Повний зліпок системи</text>
    <text x="20" y="86" fill="#94a3b8" font-family="sans-serif" font-size="10.5">Включає: користувачів, організації, проєкти,</text>
    <text x="20" y="103" fill="#94a3b8" font-family="sans-serif" font-size="10.5">всі задачі, компоненти, трекінг часу та аудит-лог.</text>

    <!-- File Format Specification Box -->
    <rect x="20" y="125" width="340" height="90" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <circle cx="45" cy="155" r="16" fill="#10b981" fill-opacity="0.15"/>
    <text x="45" y="160" fill="#10b981" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">ZIP</text>
    <text x="75" y="148" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="bold">backup_2026-11-09_1330.stsup</text>
    <text x="75" y="166" fill="#64748b" font-family="sans-serif" font-size="10">Стиснення: Gzip / JSON Payload + Attachments</text>
    <text x="75" y="182" fill="#64748b" font-family="sans-serif" font-size="10">Контрольна сума: SHA-256 інтегрована</text>

    <!-- Download CTA Button -->
    <rect x="20" y="240" width="340" height="50" rx="8" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1.5"/>
    <circle cx="45" cy="265" r="14" fill="#10b981"/>
    <text x="45" y="270" fill="#0f172a" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">⬇</text>
    <text x="70" y="262" fill="#34d399" font-family="sans-serif" font-size="12.5" font-weight="bold">Завантажити резервну копію</text>
    <text x="70" y="278" fill="#a7f3d0" font-family="sans-serif" font-size="10">Створює актуальний бекап без зупинки сервісу</text>

    <!-- Operational Note -->
    <rect x="20" y="315" width="340" height="60" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="30" y="335" fill="#38bdf8" font-family="sans-serif" font-size="10" font-weight="bold">💡 Рекомендація з безпеки:</text>
    <text x="30" y="352" fill="#94a3b8" font-family="sans-serif" font-size="9.5">Експортуйте файл перед будь-яким оновленням версії</text>
    <text x="30" y="365" fill="#94a3b8" font-family="sans-serif" font-size="9.5">або міграцією сервера на новий хост.</text>

    <!-- Callout 1 -->
    <circle cx="345" cy="240" r="11" fill="#ef4444"/>
    <text x="345" y="244" fill="#fff" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">❶</text>
  </g>

  <!-- RIGHT PANE: RESTORE & CONFIRMATION MODAL -->
  <g transform="translate(480, 75)">
    <rect width="380" height="400" rx="12" fill="url(#cardGrad14)" stroke="#ef4444" stroke-width="1.2" stroke-opacity="0.8" filter="url(#shadow14)"/>
    <path d="M 0 12 A 12 12 0 0 1 12 0 L 368 0 A 12 12 0 0 1 380 12 L 380 36 L 0 36 Z" fill="#7f1d1d"/>
    <text x="16" y="23" fill="#fca5a5" font-family="sans-serif" font-size="12" font-weight="bold">ВІДНОВЛЕННЯ З ФАЙЛУ (.stsup)</text>

    <!-- Dropzone Area -->
    <rect x="20" y="48" width="340" height="85" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1.5" stroke-dasharray="4 4"/>
    <text x="190" y="80" fill="#94a3b8" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Перетягніть сюди файл .stsup</text>
    <text x="190" y="98" fill="#64748b" font-family="sans-serif" font-size="10" text-anchor="middle">або клікніть для вибору на комп'ютері</text>
    <rect x="140" y="108" width="100" height="18" rx="4" fill="#1e293b"/>
    <text x="190" y="120" fill="#38bdf8" font-family="monospace" font-size="9" text-anchor="middle">файл завантажено ✓</text>

    <!-- Warning / Confirmation Box Mockup (Strict Protection) -->
    <rect x="20" y="148" width="340" height="230" rx="8" fill="#1e293b" stroke="#ef4444" stroke-width="1.5"/>
    
    <text x="35" y="174" fill="#ef4444" font-family="sans-serif" font-size="12" font-weight="bold">⚠️ Увага: Незворотна дія!</text>
    <text x="35" y="194" fill="#fca5a5" font-family="sans-serif" font-size="10.5">Відновлення повністю замінить поточні дані.</text>
    <text x="35" y="210" fill="#fca5a5" font-family="sans-serif" font-size="10.5">Всі незбережені зміни будуть видалені.</text>

    <!-- Input Confirmation Field -->
    <text x="35" y="240" fill="#cbd5e1" font-family="sans-serif" font-size="10.5" font-weight="bold">Для підтвердження введіть слово <tspan fill="#ef4444" font-family="monospace">ВІДНОВИТИ</tspan>:</text>
    <rect x="35" y="250" width="310" height="34" rx="6" fill="#0f172a" stroke="#ef4444" stroke-width="1.5"/>
    <text x="48" y="272" fill="#ef4444" font-family="monospace" font-size="13" font-weight="bold" letter-spacing="2">ВІДНОВИТИ</text>

    <!-- Execute Restore Button -->
    <rect x="35" y="300" width="310" height="38" rx="6" fill="#dc2626" stroke="#ef4444" stroke-width="1"/>
    <text x="190" y="324" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Підтвердити та перезаписати базу</text>

    <text x="190" y="360" fill="#64748b" font-family="sans-serif" font-size="9.5" text-anchor="middle">Аудит-запис про відновлення записується у системний лог</text>

    <!-- Callout 2 & 3 -->
    <circle cx="345" cy="50" r="11" fill="#38bdf8"/>
    <text x="345" y="54" fill="#fff" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">❷</text>

    <circle cx="345" cy="250" r="11" fill="#ef4444"/>
    <text x="345" y="254" fill="#fff" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">❸</text>
  </g>
</svg>
