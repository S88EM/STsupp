<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="navGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="shadow2" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="920" height="480" fill="url(#bgGrad2)"/>
  <rect x="20" y="20" width="880" height="440" rx="16" fill="none" stroke="#334155" stroke-width="1.5"/>

  <!-- Window Header -->
  <path d="M 20 36 A 16 16 0 0 1 36 20 L 884 20 A 16 16 0 0 1 900 36 L 900 60 L 20 60 Z" fill="#1e293b"/>
  <circle cx="45" cy="40" r="5" fill="#ef4444"/>
  <circle cx="62" cy="40" r="5" fill="#f59e0b"/>
  <circle cx="79" cy="40" r="5" fill="#10b981"/>
  <text x="460" y="44" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="12" font-weight="600" text-anchor="middle">STsup — Верхня панель (Navbar) та глобальна навігація</text>

  <!-- NAVBAR CONTAINER -->
  <g transform="translate(40, 80)">
    <rect width="840" height="70" rx="12" fill="url(#navGrad)" stroke="#334155" stroke-width="1.5" filter="url(#shadow2)"/>

    <!-- 1. Logo -->
    <rect x="20" y="15" width="40" height="40" rx="10" fill="#3b82f6" fill-opacity="0.15" stroke="#3b82f6" stroke-width="1.2"/>
    <text x="40" y="39" fill="#38bdf8" font-family="monospace" font-size="16" font-weight="bold" text-anchor="middle">ST</text>

    <!-- 2. Project Selector Dropdown -->
    <rect x="75" y="16" width="170" height="38" rx="8" fill="#0f172a" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="90" y="39" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="12" font-weight="bold">Всі проєкти</text>
    <text x="175" y="39" fill="#64748b" font-family="monospace" font-size="10">[ALL]</text>
    <polygon points="228,33 234,41 240,33" fill="#94a3b8"/>

    <!-- 3. View Mode Switcher (List vs Board) -->
    <rect x="270" y="18" width="170" height="34" rx="7" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <!-- Active Tab: List -->
    <rect x="273" y="21" width="82" height="28" rx="5" fill="#2563eb"/>
    <text x="314" y="39" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11" font-weight="bold" text-anchor="middle">📋 Задачі</text>
    <!-- Inactive Tab: Board -->
    <text x="400" y="39" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11" font-weight="medium" text-anchor="middle">📊 Дошка</text>

    <!-- 4. Quick Create Button -->
    <rect x="465" y="16" width="130" height="38" rx="8" fill="#2563eb" stroke="#3b82f6" stroke-width="1"/>
    <text x="480" y="39" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="14" font-weight="bold">+</text>
    <text x="535" y="39" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11" font-weight="bold" text-anchor="middle">Створити</text>

    <!-- 5. Search Bar -->
    <rect x="615" y="18" width="115" height="34" rx="7" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="630" y="39" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="10">🔍 Пошук...</text>

    <!-- 6. User Profile -->
    <circle cx="760" cy="35" r="17" fill="#3b82f6" fill-opacity="0.2" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="760" y="40" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11" font-weight="bold" text-anchor="middle">AD</text>
    <!-- Admin Role Badge -->
    <rect x="785" y="24" width="45" height="22" rx="4" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1"/>
    <text x="807" y="38" fill="#34d399" font-family="monospace" font-size="9" font-weight="bold" text-anchor="middle">ADMIN</text>

    <!-- Visual Highlights -->
    <!-- Callout 1: Project Selector -->
    <rect x="70" y="10" width="180" height="50" rx="10" fill="none" stroke="#f43f5e" stroke-width="2" stroke-dasharray="5 3"/>
    <circle cx="255" cy="10" r="11" fill="#f43f5e"/>
    <text x="255" y="14" fill="#ffffff" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">1</text>

    <!-- Callout 2: View Switcher -->
    <rect x="265" y="12" width="180" height="46" rx="9" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="5 3"/>
    <circle cx="450" cy="12" r="11" fill="#38bdf8"/>
    <text x="450" y="16" fill="#0f172a" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">2</text>

    <!-- Callout 3: Create Button -->
    <rect x="460" y="10" width="140" height="50" rx="10" fill="none" stroke="#eab308" stroke-width="2" stroke-dasharray="5 3"/>
    <circle cx="605" cy="10" r="11" fill="#eab308"/>
    <text x="605" y="14" fill="#0f172a" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">3</text>

    <!-- Callout 4: Profile / Admin -->
    <rect x="740" y="10" width="95" height="50" rx="10" fill="none" stroke="#10b981" stroke-width="2" stroke-dasharray="5 3"/>
    <circle cx="838" cy="10" r="11" fill="#10b981"/>
    <text x="838" y="14" fill="#0f172a" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">4</text>
  </g>

  <!-- DROPDOWN EXPANDED OVERLAY MOCKUP -->
  <g transform="translate(115, 175)">
    <rect width="260" height="230" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.5" filter="url(#shadow2)"/>
    
    <text x="18" y="24" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="10" font-weight="bold">ОБЕРІТЬ ПРОЄКТ</text>
    
    <!-- Item: All Projects (Active) -->
    <rect x="10" y="35" width="240" height="36" rx="6" fill="#2563eb" fill-opacity="0.15" stroke="#3b82f6" stroke-width="1"/>
    <circle cx="28" cy="53" r="5" fill="#38bdf8"/>
    <text x="42" y="57" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11" font-weight="bold">Всі проєкти (Global)</text>
    <text x="215" y="57" fill="#38bdf8" font-family="monospace" font-size="10">✓</text>

    <!-- Item: Riga Smart -->
    <rect x="10" y="78" width="240" height="34" rx="6" fill="#0f172a" stroke="#334155" stroke-width="0.8"/>
    <text x="25" y="99" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11">RIGA — Riga Smart Hub</text>
    <text x="215" y="99" fill="#64748b" font-family="monospace" font-size="9">12 задач</text>

    <!-- Item: Core Infrastructure -->
    <rect x="10" y="118" width="240" height="34" rx="6" fill="#0f172a" stroke="#334155" stroke-width="0.8"/>
    <text x="25" y="139" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11">CORE — Інфраструктура</text>
    <text x="215" y="139" fill="#64748b" font-family="monospace" font-size="9">8 задач</text>

    <!-- Item: Service Desk -->
    <rect x="10" y="158" width="240" height="34" rx="6" fill="#0f172a" stroke="#334155" stroke-width="0.8"/>
    <text x="25" y="179" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11">ST — Service Desk Support</text>
    <text x="215" y="179" fill="#64748b" font-family="monospace" font-size="9">24 задачі</text>

    <!-- Footer button -->
    <line x1="10" y1="198" x2="250" y2="198" stroke="#334155" stroke-width="1"/>
    <text x="130" y="217" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="10" font-weight="bold" text-anchor="middle">+ Створити новий проєкт</text>
  </g>

  <!-- Explanatory Legend / Badges Box -->
  <g transform="translate(420, 185)">
    <rect width="460" height="220" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.2"/>
    <text x="25" y="32" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="12" font-weight="bold">Елементи керування та правила навігації:</text>
    
    <circle cx="35" cy="65" r="9" fill="#f43f5e"/>
    <text x="35" y="69" fill="#ffffff" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">1</text>
    <text x="55" y="68" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11" font-weight="600">Селектор контексту:</text>
    <text x="195" y="68" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11">перемикає між окремими проєктами або «Всі проєкти».</text>

    <circle cx="35" cy="105" r="9" fill="#38bdf8"/>
    <text x="35" y="109" fill="#0f172a" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">2</text>
    <text x="55" y="108" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11" font-weight="600">Перемикач подання:</text>
    <text x="195" y="108" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11">«Задачі» (3-панельний список) ↔ «Дошка» (Канбан).</text>

    <circle cx="35" cy="145" r="9" fill="#eab308"/>
    <text x="35" y="149" fill="#0f172a" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">3</text>
    <text x="55" y="148" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11" font-weight="600">Кнопка «+ Створити»:</text>
    <text x="195" y="148" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11">відкриває модальне вікно Jira Quick Issue Creation.</text>

    <circle cx="35" cy="185" r="9" fill="#10b981"/>
    <text x="35" y="189" fill="#0f172a" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">4</text>
    <text x="55" y="188" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11" font-weight="600">Профіль користувача:</text>
    <text x="195" y="188" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11">показує поточну роль та дає доступ до /settings і виходу.</text>
  </g>
</svg>
