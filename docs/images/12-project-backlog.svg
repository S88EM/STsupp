<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad12" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="cardGrad12" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="shadow12" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="900" height="520" fill="url(#bgGrad12)"/>
  <rect x="20" y="20" width="860" height="480" rx="14" fill="none" stroke="#334155" stroke-width="1.5"/>

  <!-- Window Header -->
  <path d="M 20 34 A 14 14 0 0 1 34 20 L 866 20 A 14 14 0 0 1 880 34 L 880 58 L 20 58 Z" fill="#1e293b"/>
  <circle cx="45" cy="39" r="5" fill="#ef4444"/>
  <circle cx="62" cy="39" r="5" fill="#f59e0b"/>
  <circle cx="79" cy="39" r="5" fill="#10b981"/>
  <text x="450" y="43" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">STsup — Реєстр беклогу проєкту (?section=backlog) та пріоритизація</text>

  <!-- SUBHEADER / SECTION TABS -->
  <g transform="translate(40, 70)">
    <!-- Tab 1: Issues -->
    <rect x="0" y="0" width="120" height="32" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="60" y="21" fill="#94a3b8" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">Усі задачі (18)</text>

    <!-- Tab 2: Backlog Active -->
    <rect x="130" y="0" width="130" height="32" rx="6" fill="#3b82f6" fill-opacity="0.2" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="195" y="21" fill="#38bdf8" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Беклог проєкту (4)</text>

    <!-- Tab 3: Boards link -->
    <rect x="270" y="0" width="110" height="32" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="325" y="21" fill="#94a3b8" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">Kanban-дошка</text>

    <!-- Project context label -->
    <text x="540" y="21" fill="#cbd5e1" font-family="sans-serif" font-size="12">Контекст: <tspan fill="#38bdf8" font-weight="bold">RIGA (Riga Mall Support)</tspan></text>
  </g>

  <!-- TABLE CONTAINER -->
  <g transform="translate(40, 115)">
    <rect width="820" height="360" rx="10" fill="url(#cardGrad12)" stroke="#334155" stroke-width="1.5" filter="url(#shadow12)"/>

    <!-- Table Header Row -->
    <rect width="820" height="38" rx="10" fill="#1e293b"/>
    <rect x="15" y="12" width="14" height="14" rx="3" fill="#0f172a" stroke="#475569" stroke-width="1.2"/>
    <text x="45" y="24" fill="#64748b" font-family="sans-serif" font-size="11" font-weight="bold">КЛЮЧ</text>
    <text x="140" y="24" fill="#64748b" font-family="sans-serif" font-size="11" font-weight="bold">НАЗВА ЗАДАЧІ</text>
    <text x="420" y="24" fill="#64748b" font-family="sans-serif" font-size="11" font-weight="bold">КОМПОНЕНТ</text>
    <text x="540" y="24" fill="#64748b" font-family="sans-serif" font-size="11" font-weight="bold">ПРІОРИТЕТ</text>
    <text x="645" y="24" fill="#64748b" font-family="sans-serif" font-size="11" font-weight="bold">ОЦІНКА</text>
    <text x="730" y="24" fill="#64748b" font-family="sans-serif" font-size="11" font-weight="bold">ДІЇ</text>

    <!-- Row 1 -->
    <rect x="5" y="44" width="810" height="48" rx="6" fill="#0f172a" fill-opacity="0.4"/>
    <rect x="15" y="60" width="14" height="14" rx="3" fill="#0f172a" stroke="#475569" stroke-width="1.2"/>
    <text x="45" y="73" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="bold">RIGA-6</text>
    <text x="140" y="73" fill="#f8fafc" font-family="sans-serif" font-size="12" font-weight="500">Налаштування резервного каналу зв'язку</text>
    <rect x="420" y="58" width="90" height="22" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="465" y="73" fill="#94a3b8" font-family="sans-serif" font-size="10.5" text-anchor="middle">Мережа</text>
    <text x="540" y="73" fill="#ef4444" font-family="sans-serif" font-size="11" font-weight="bold">🔴 Високий</text>
    <text x="645" y="73" fill="#cbd5e1" font-family="monospace" font-size="11">2d 4h</text>
    <!-- Action button -->
    <rect x="725" y="56" width="80" height="26" rx="5" fill="#2563eb" fill-opacity="0.2" stroke="#3b82f6" stroke-width="1"/>
    <text x="765" y="73" fill="#38bdf8" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">В роботу →</text>

    <!-- Row 2 -->
    <rect x="5" y="98" width="810" height="48" rx="6" fill="#0f172a" fill-opacity="0.2"/>
    <rect x="15" y="114" width="14" height="14" rx="3" fill="#0f172a" stroke="#475569" stroke-width="1.2"/>
    <text x="45" y="127" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="bold">RIGA-8</text>
    <text x="140" y="127" fill="#f8fafc" font-family="sans-serif" font-size="12" font-weight="500">Оновлення драйверів фіскальних реєстраторів</text>
    <rect x="420" y="112" width="90" height="22" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="465" y="127" fill="#94a3b8" font-family="sans-serif" font-size="10.5" text-anchor="middle">Каси / POS</text>
    <text x="540" y="127" fill="#f59e0b" font-family="sans-serif" font-size="11" font-weight="bold">🟡 Середній</text>
    <text x="645" y="127" fill="#cbd5e1" font-family="monospace" font-size="11">1d</text>
    <rect x="725" y="110" width="80" height="26" rx="5" fill="#2563eb" fill-opacity="0.2" stroke="#3b82f6" stroke-width="1"/>
    <text x="765" y="127" fill="#38bdf8" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">В роботу →</text>

    <!-- Row 3 -->
    <rect x="5" y="152" width="810" height="48" rx="6" fill="#0f172a" fill-opacity="0.4"/>
    <rect x="15" y="168" width="14" height="14" rx="3" fill="#0f172a" stroke="#475569" stroke-width="1.2"/>
    <text x="45" y="181" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="bold">RIGA-11</text>
    <text x="140" y="181" fill="#f8fafc" font-family="sans-serif" font-size="12" font-weight="500">Доопрацювання шаблону друку чеків</text>
    <rect x="420" y="166" width="90" height="22" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="465" y="181" fill="#94a3b8" font-family="sans-serif" font-size="10.5" text-anchor="middle">Звіти</text>
    <text x="540" y="181" fill="#10b981" font-family="sans-serif" font-size="11" font-weight="bold">🟢 Низький</text>
    <text x="645" y="181" fill="#cbd5e1" font-family="monospace" font-size="11">4h</text>
    <rect x="725" y="164" width="80" height="26" rx="5" fill="#2563eb" fill-opacity="0.2" stroke="#3b82f6" stroke-width="1"/>
    <text x="765" y="181" fill="#38bdf8" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">В роботу →</text>

    <!-- Row 4 -->
    <rect x="5" y="206" width="810" height="48" rx="6" fill="#0f172a" fill-opacity="0.2"/>
    <rect x="15" y="222" width="14" height="14" rx="3" fill="#0f172a" stroke="#475569" stroke-width="1.2"/>
    <text x="45" y="235" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="bold">RIGA-15</text>
    <text x="140" y="235" fill="#f8fafc" font-family="sans-serif" font-size="12" font-weight="500">Інтеграція з локальною базою штрихкодів</text>
    <rect x="420" y="220" width="90" height="22" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="465" y="235" fill="#94a3b8" font-family="sans-serif" font-size="10.5" text-anchor="middle">Склад</text>
    <text x="540" y="235" fill="#f59e0b" font-family="sans-serif" font-size="11" font-weight="bold">🟡 Середній</text>
    <text x="645" y="235" fill="#cbd5e1" font-family="monospace" font-size="11">1w</text>
    <rect x="725" y="218" width="80" height="26" rx="5" fill="#2563eb" fill-opacity="0.2" stroke="#3b82f6" stroke-width="1"/>
    <text x="765" y="235" fill="#38bdf8" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">В роботу →</text>

    <!-- Information footer banner -->
    <rect x="15" y="275" width="790" height="65" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="30" y="300" fill="#38bdf8" font-family="sans-serif" font-size="11" font-weight="bold">💡 Принцип роботи реєстру Беклогу:</text>
    <text x="30" y="318" fill="#94a3b8" font-family="sans-serif" font-size="10.5">Сюди автоматично потрапляють задачі зі статусом <tspan fill="#f8fafc" font-family="monospace">BACKLOG</tspan>. Вони ще не взяті в активну розробку або спрінт.</text>
    <text x="30" y="333" fill="#94a3b8" font-family="sans-serif" font-size="10.5">Клік на «В роботу →» миттєво переводить тікет у статус <tspan fill="#38bdf8" font-family="monospace">IN_PROGRESS</tspan> і переносить його на Kanban-дошку.</text>
  </g>

  <!-- CALLOUT BADGES ❶, ❷ -->
  <circle cx="270" cy="85" r="12" fill="#ef4444"/>
  <text x="270" y="90" fill="#fff" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">❶</text>

  <circle cx="810" cy="180" r="12" fill="#38bdf8"/>
  <text x="810" y="185" fill="#fff" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">❷</text>
</svg>
