<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 490" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="shadow3" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="920" height="490" fill="url(#bgGrad3)"/>
  <rect x="20" y="20" width="880" height="450" rx="16" fill="none" stroke="#334155" stroke-width="1.5"/>

  <!-- Window Top Bar -->
  <path d="M 20 36 A 16 16 0 0 1 36 20 L 884 20 A 16 16 0 0 1 900 36 L 900 60 L 20 60 Z" fill="#1e293b"/>
  <circle cx="45" cy="40" r="5" fill="#ef4444"/>
  <circle cx="62" cy="40" r="5" fill="#f59e0b"/>
  <circle cx="79" cy="40" r="5" fill="#10b981"/>
  <text x="460" y="44" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="12" font-weight="600" text-anchor="middle">STsup — Уніфікована маршрутизація: Канонічні URL (/browse/{KEY}-{ID})</text>

  <!-- BROWSER ADDRESS BAR COMPARISON -->
  <g transform="translate(50, 80)">
    <!-- Old Technical URL (Deprecated / Replaced) -->
    <rect width="820" height="48" rx="8" fill="#1e293b" fill-opacity="0.5" stroke="#ef4444" stroke-width="1" stroke-dasharray="4 3"/>
    <text x="20" y="29" fill="#ef4444" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11" font-weight="bold">❌ СТАРИЙ ТЕХНІЧНИЙ URL (UUID):</text>
    <text x="260" y="29" fill="#94a3b8" font-family="monospace" font-size="11" text-decoration="line-through">https://jira.pijon.keenetic.link/projects/f55e2f8c-7afe-4451?taskId=5cfe55f2-85e9&amp;section=issues</text>

    <!-- New Canonical Clean URL -->
    <rect y="60" width="820" height="54" rx="10" fill="#0f172a" stroke="#10b981" stroke-width="2" filter="url(#shadow3)"/>
    <text x="20" y="93" fill="#10b981" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="12" font-weight="bold">✓ КАНОНІЧНИЙ ШВИДКИЙ URL:</text>
    <rect x="250" y="70" width="410" height="34" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="265" y="92" fill="#38bdf8" font-family="monospace" font-size="13" font-weight="bold">https://jira.pijon.keenetic.link/browse/RIGA-2</text>
    
    <!-- Copy Indicator -->
    <rect x="670" y="70" width="135" height="34" rx="6" fill="#0284c7" stroke="#38bdf8" stroke-width="1"/>
    <text x="737" y="92" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11" font-weight="bold" text-anchor="middle">📋 Скопіювати лінк</text>

    <!-- Visual Callout 1 -->
    <rect x="245" y="65" width="420" height="44" rx="8" fill="none" stroke="#f43f5e" stroke-width="2" stroke-dasharray="5 3"/>
    <circle cx="235" cy="85" r="12" fill="#f43f5e"/>
    <text x="235" y="90" fill="#ffffff" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">1</text>
  </g>

  <!-- INTERACTIVE TASK HEADER CARD MOCKUP -->
  <g transform="translate(50, 215)">
    <rect width="820" height="150" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5" filter="url(#shadow3)"/>

    <!-- Breadcrumb with Clickable Badge -->
    <text x="30" y="38" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="12">Riga Smart Hub / </text>
    
    <!-- Clickable Task Code Badge -->
    <rect x="150" y="18" width="100" height="32" rx="6" fill="#3b82f6" fill-opacity="0.15" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="160" y="39" fill="#38bdf8" font-family="monospace" font-size="14" font-weight="bold">RIGA-2</text>
    <text x="225" y="39" fill="#38bdf8" font-family="monospace" font-size="12">🔗</text>

    <!-- Task Title -->
    <text x="30" y="80" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="17" font-weight="bold">Оптимізація швидкодії PostgreSQL бази даних та очищення кешу</text>

    <!-- Metadata Row -->
    <rect x="30" y="100" width="80" height="26" rx="5" fill="#3b82f6" fill-opacity="0.2" stroke="#3b82f6" stroke-width="1"/>
    <text x="70" y="117" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11" font-weight="bold" text-anchor="middle">В РОБОТІ</text>

    <text x="130" y="117" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11">Пріоритет: <tspan fill="#f59e0b" font-weight="bold">Високий</tspan></text>
    <text x="270" y="117" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11">Виконавець: <tspan fill="#e2e8f0" font-weight="bold">Ігор М. (Інженер)</tspan></text>
    <text x="490" y="117" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11">Автор: <tspan fill="#e2e8f0">client@keenetic.link</tspan></text>

    <!-- Visual Callout 2: Task Badge click -->
    <rect x="145" y="14" width="110" height="40" rx="8" fill="none" stroke="#eab308" stroke-width="2" stroke-dasharray="5 3"/>
    <circle cx="265" cy="20" r="11" fill="#eab308"/>
    <text x="265" y="24" fill="#0f172a" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">2</text>

    <!-- TOAST POPUP NOTIFICATION (bottom right of card) -->
    <g transform="translate(420, 20)">
      <rect width="370" height="46" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1.5" filter="url(#shadow3)"/>
      <circle cx="25" cy="23" r="10" fill="#10b981" fill-opacity="0.2"/>
      <text x="25" y="27" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11" font-weight="bold" text-anchor="middle">✓</text>
      <text x="45" y="21" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11" font-weight="bold">Посилання скопійовано в буфер обміну!</text>
      <text x="45" y="37" fill="#94a3b8" font-family="monospace" font-size="10">https://jira.pijon.keenetic.link/browse/RIGA-2</text>
      
      <!-- Visual Callout 3: Toast Notification -->
      <circle cx="380" cy="23" r="11" fill="#10b981"/>
      <text x="380" y="27" fill="#0f172a" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">3</text>
    </g>
  </g>

  <!-- EXPLANATORY FOOTER NOTE -->
  <g transform="translate(50, 385)">
    <rect width="820" height="65" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="20" y="25" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11" font-weight="bold">💡 Переваги уніфікованої маршрутизації для команди та клієнтів:</text>
    <text x="20" y="45" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="10.5">• Клік по бейджу коду задачі автоматично копіює пряме канонічне посилання та відображає підтверджуючий Toast-попап.</text>
    <text x="20" y="58" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="10.5">• При переході за технічним старим лінком адресний рядок браузера миттєво підміняється на чистий формат через SPA History API без перезавантаження.</text>
  </g>
</svg>
