<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad9" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="cardGrad9" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="shadow9" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="900" height="520" fill="url(#bgGrad9)"/>
  <rect x="20" y="20" width="860" height="480" rx="14" fill="none" stroke="#334155" stroke-width="1.5"/>

  <!-- Window Header -->
  <path d="M 20 34 A 14 14 0 0 1 34 20 L 866 20 A 14 14 0 0 1 880 34 L 880 58 L 20 58 Z" fill="#1e293b"/>
  <circle cx="45" cy="39" r="5" fill="#ef4444"/>
  <circle cx="62" cy="39" r="5" fill="#f59e0b"/>
  <circle cx="79" cy="39" r="5" fill="#10b981"/>
  <text x="450" y="43" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">STsup — Клієнтський портал (/portal) та подання звернень</text>

  <!-- PORTAL NAVBAR -->
  <rect x="35" y="70" width="830" height="46" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <rect x="47" y="79" width="28" height="28" rx="6" fill="#3b82f6" fill-opacity="0.2"/>
  <text x="61" y="98" fill="#38bdf8" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle">ST</text>
  <text x="86" y="98" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="13" font-weight="700">Портал самообслуговування клієнта</text>

  <!-- User badge on top right -->
  <rect x="680" y="78" width="170" height="30" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <circle cx="696" cy="93" r="8" fill="#38bdf8"/>
  <text x="696" y="97" fill="#0f172a" font-family="sans-serif" font-size="9" font-weight="bold" text-anchor="middle">КЛ</text>
  <text x="712" y="97" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11">ТОВ «АгроТрейд» (Клієнт)</text>

  <!-- KPI CARDS ROW -->
  <!-- KPI 1 -->
  <rect x="35" y="128" width="190" height="70" rx="8" fill="url(#cardGrad9)" stroke="#334155" stroke-width="1" filter="url(#shadow9)"/>
  <text x="50" y="148" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11">Всього звернень</text>
  <text x="50" y="182" fill="#f8fafc" font-family="sans-serif" font-size="24" font-weight="bold">14</text>
  <circle cx="195" cy="163" r="14" fill="#3b82f6" fill-opacity="0.15"/>
  <text x="195" y="167" fill="#3b82f6" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">📁</text>

  <!-- KPI 2 -->
  <rect x="245" y="128" width="190" height="70" rx="8" fill="url(#cardGrad9)" stroke="#334155" stroke-width="1" filter="url(#shadow9)"/>
  <text x="260" y="148" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11">В роботі у підтримки</text>
  <text x="260" y="182" fill="#38bdf8" font-family="sans-serif" font-size="24" font-weight="bold">5</text>
  <circle cx="405" cy="163" r="14" fill="#0284c7" fill-opacity="0.15"/>
  <text x="405" y="167" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">⚡</text>

  <!-- KPI 3 -->
  <rect x="455" y="128" width="190" height="70" rx="8" fill="url(#cardGrad9)" stroke="#f59e0b" stroke-width="1.2" stroke-opacity="0.6" filter="url(#shadow9)"/>
  <text x="470" y="148" fill="#f59e0b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11" font-weight="600">Очікує відповіді клієнта</text>
  <text x="470" y="182" fill="#f59e0b" font-family="sans-serif" font-size="24" font-weight="bold">2</text>
  <circle cx="615" cy="163" r="14" fill="#f59e0b" fill-opacity="0.2"/>
  <text x="615" y="167" fill="#f59e0b" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">💬</text>

  <!-- CTA: New Ticket Button -->
  <rect x="665" y="138" width="200" height="48" rx="8" fill="#2563eb" stroke="#3b82f6" stroke-width="1.5" filter="url(#shadow9)"/>
  <text x="765" y="167" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="13" font-weight="bold" text-anchor="middle">+ Створити звернення</text>

  <!-- TICKETS TABLE SECTION -->
  <rect x="35" y="215" width="830" height="270" rx="10" fill="url(#cardGrad9)" stroke="#334155" stroke-width="1"/>
  
  <!-- Table Header -->
  <rect x="35" y="215" width="830" height="34" rx="10" fill="#1e293b"/>
  <text x="55" y="237" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11" font-weight="bold">КОД</text>
  <text x="145" y="237" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11" font-weight="bold">ТЕМА ЗВЕРНЕННЯ</text>
  <text x="490" y="237" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11" font-weight="bold">ПРІОРИТЕТ</text>
  <text x="600" y="237" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11" font-weight="bold">СТАТУС</text>
  <text x="735" y="237" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11" font-weight="bold">ОНОВЛЕНО</text>

  <!-- Row 1 -->
  <rect x="40" y="254" width="820" height="42" rx="6" fill="#0f172a" fill-opacity="0.4"/>
  <text x="55" y="280" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="bold">RIGA-4</text>
  <text x="145" y="280" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="12">Збій синхронізації оплат через платіжний шлюз</text>
  <rect x="490" y="267" width="60" height="20" rx="4" fill="#ef4444" fill-opacity="0.15" stroke="#ef4444" stroke-width="0.8"/>
  <text x="520" y="281" fill="#ef4444" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Високий</text>
  <rect x="600" y="267" width="85" height="20" rx="4" fill="#0284c7" fill-opacity="0.2"/>
  <text x="642" y="281" fill="#38bdf8" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">В роботі</text>
  <text x="735" y="280" fill="#94a3b8" font-family="sans-serif" font-size="11">10 хв тому</text>

  <!-- Row 2 (Awaiting Client feedback) -->
  <rect x="40" y="302" width="820" height="42" rx="6" fill="#f59e0b" fill-opacity="0.06" stroke="#f59e0b" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="55" y="328" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="bold">RIGA-2</text>
  <text x="145" y="328" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="12">Уточнення доступу до тестового стенду API</text>
  <rect x="490" y="315" width="60" height="20" rx="4" fill="#3b82f6" fill-opacity="0.15"/>
  <text x="520" y="329" fill="#93c5fd" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Середній</text>
  <rect x="600" y="315" width="118" height="20" rx="4" fill="#f59e0b" fill-opacity="0.2"/>
  <text x="659" y="329" fill="#f59e0b" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Очікує клієнта ⚡</text>
  <text x="735" y="328" fill="#f59e0b" font-family="sans-serif" font-size="11">Сьогодні, 12:15</text>

  <!-- Row 3 -->
  <rect x="40" y="350" width="820" height="42" rx="6" fill="#0f172a" fill-opacity="0.4"/>
  <text x="55" y="376" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="bold">RIGA-1</text>
  <text x="145" y="376" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="12">Підключення додаткового користувача до CRM</text>
  <rect x="490" y="363" width="60" height="20" rx="4" fill="#64748b" fill-opacity="0.2"/>
  <text x="520" y="377" fill="#94a3b8" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Низький</text>
  <rect x="600" y="363" width="75" height="20" rx="4" fill="#10b981" fill-opacity="0.2"/>
  <text x="637" y="377" fill="#10b981" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Вирішено</text>
  <text x="735" y="376" fill="#94a3b8" font-family="sans-serif" font-size="11">Вчора</text>

  <!-- CALLOUT BADGES ❶, ❷, ❸ -->
  <!-- Callout 1: Unassigned ticket creation -->
  <circle cx="765" cy="120" r="12" fill="#ef4444"/>
  <text x="765" y="125" fill="#fff" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">❶</text>
  <rect x="640" y="80" width="220" height="28" rx="6" fill="#0f172a" stroke="#ef4444" stroke-width="1.2"/>
  <text x="750" y="98" fill="#fca5a5" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">❶ Створення без призначеного інженера</text>

  <!-- Callout 2: Organization boundary -->
  <circle cx="780" cy="62" r="12" fill="#3b82f6"/>
  <text x="780" y="67" fill="#fff" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">❷</text>
  
  <!-- Callout 3: Client waiting status -->
  <circle cx="725" cy="325" r="12" fill="#f59e0b"/>
  <text x="725" y="330" fill="#fff" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">❸</text>
  <rect x="580" y="415" width="270" height="55" rx="6" fill="#0f172a" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="590" y="433" fill="#fbbf24" font-family="sans-serif" font-size="10" font-weight="bold">❸ Тікети у статусі «Очікує клієнта»:</text>
  <text x="590" y="450" fill="#cbd5e1" font-family="sans-serif" font-size="9.5">Вимагають реакції або уточнення від замовника.</text>
  <text x="590" y="463" fill="#cbd5e1" font-family="sans-serif" font-size="9.5">Швидка дія «Повернути в підтримку» повертає в роботу.</text>
</svg>
