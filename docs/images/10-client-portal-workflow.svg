<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad10" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="cardGrad10" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <marker id="arrowB" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#38bdf8"/>
    </marker>
    <marker id="arrowO" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#f59e0b"/>
    </marker>
    <filter id="shadow10" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="900" height="520" fill="url(#bgGrad10)"/>
  <rect x="20" y="20" width="860" height="480" rx="14" fill="none" stroke="#334155" stroke-width="1.5"/>

  <!-- Window Header -->
  <path d="M 20 34 A 14 14 0 0 1 34 20 L 866 20 A 14 14 0 0 1 880 34 L 880 58 L 20 58 Z" fill="#1e293b"/>
  <circle cx="45" cy="39" r="5" fill="#ef4444"/>
  <circle cx="62" cy="39" r="5" fill="#f59e0b"/>
  <circle cx="79" cy="39" r="5" fill="#10b981"/>
  <text x="450" y="43" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">STsup — Двосторонній життєвий цикл: «Повернути до клієнта» ⇆ «Повернути в підтримку»</text>

  <!-- LEFT PANE: Engineer Interface View -->
  <g transform="translate(40, 75)">
    <rect width="380" height="400" rx="12" fill="url(#cardGrad10)" stroke="#334155" stroke-width="1.5" filter="url(#shadow10)"/>
    <path d="M 0 12 A 12 12 0 0 1 12 0 L 368 0 A 12 12 0 0 1 380 12 L 380 36 L 0 36 Z" fill="#1e293b"/>
    <text x="15" y="23" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="bold">ІНТЕРФЕЙС ІНЖЕНЕРА (STsup Desk)</text>

    <!-- Ticket Summary -->
    <text x="20" y="62" fill="#94a3b8" font-family="monospace" font-size="11">RIGA-2 · Поточний статус: В РОБОТІ</text>
    <text x="20" y="85" fill="#f8fafc" font-family="sans-serif" font-size="13" font-weight="600">Уточнення параметрів доступу до API</text>

    <!-- Description Snippet -->
    <rect x="20" y="102" width="340" height="60" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="30" y="125" fill="#cbd5e1" font-family="sans-serif" font-size="11">Для налаштування потрібен новий секретний</text>
    <text x="30" y="143" fill="#cbd5e1" font-family="sans-serif" font-size="11">ключ від платіжного шлюзу замовника.</text>

    <!-- The Action Button on Engineer Side -->
    <rect x="20" y="185" width="340" height="48" rx="8" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-width="1.5"/>
    <circle cx="45" cy="209" r="14" fill="#f59e0b"/>
    <text x="45" y="214" fill="#0f172a" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">↺</text>
    <text x="70" y="206" fill="#fbbf24" font-family="sans-serif" font-size="12" font-weight="bold">Повернути до клієнта</text>
    <text x="70" y="222" fill="#d97706" font-family="sans-serif" font-size="10">Статус: AWAITING_CLIENT · Виконавець: Клієнт</text>

    <!-- Details Box -->
    <rect x="20" y="255" width="340" height="120" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="30" y="278" fill="#94a3b8" font-family="sans-serif" font-size="11">Автор звернення:</text>
    <text x="140" y="278" fill="#f8fafc" font-family="sans-serif" font-size="11" font-weight="600">oleg@agrotrade.ua (Клієнт)</text>
    
    <text x="30" y="303" fill="#94a3b8" font-family="sans-serif" font-size="11">Поточний виконавець:</text>
    <text x="160" y="303" fill="#38bdf8" font-family="sans-serif" font-size="11" font-weight="600">oleg@agrotrade.ua 👤</text>

    <text x="30" y="328" fill="#94a3b8" font-family="sans-serif" font-size="11">Коментар передачі:</text>
    <text x="30" y="348" fill="#cbd5e1" font-family="sans-serif" font-size="10.5" font-style="italic">«Олеже, надішліть будь ласка оновлений ключ»</text>

    <!-- Callout 1 -->
    <circle cx="345" cy="185" r="11" fill="#ef4444"/>
    <text x="345" y="189" fill="#fff" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">❶</text>
  </g>

  <!-- CENTER BIDIRECTIONAL FLOW ARROWS -->
  <g transform="translate(425, 180)">
    <!-- Top arrow: to client -->
    <path d="M 0 30 C 25 10, 25 10, 50 30" fill="none" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#arrowO)"/>
    <text x="25" y="10" fill="#f59e0b" font-family="sans-serif" font-size="9" font-weight="bold" text-anchor="middle">1. Запит даних</text>

    <!-- Bottom arrow: back to support -->
    <path d="M 50 110 C 25 130, 25 130, 0 110" fill="none" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrowB)"/>
    <text x="25" y="145" fill="#38bdf8" font-family="sans-serif" font-size="9" font-weight="bold" text-anchor="middle">2. Відповідь</text>
  </g>

  <!-- RIGHT PANE: Client Portal Modal View -->
  <g transform="translate(480, 75)">
    <rect width="380" height="400" rx="12" fill="url(#cardGrad10)" stroke="#334155" stroke-width="1.5" filter="url(#shadow10)"/>
    <path d="M 0 12 A 12 12 0 0 1 12 0 L 368 0 A 12 12 0 0 1 380 12 L 380 36 L 0 36 Z" fill="#1e293b"/>
    <text x="15" y="23" fill="#10b981" font-family="sans-serif" font-size="12" font-weight="bold">ПОРТАЛ КЛІЄНТА (/portal)</text>

    <!-- Notification Header in Portal -->
    <rect x="15" y="46" width="350" height="34" rx="6" fill="#f59e0b" fill-opacity="0.12" stroke="#f59e0b" stroke-width="1"/>
    <text x="25" y="68" fill="#fbbf24" font-family="sans-serif" font-size="11" font-weight="bold">⚡ Інженер очікує вашої відповіді або файлів</text>

    <!-- Ticket View for Client -->
    <text x="20" y="105" fill="#94a3b8" font-family="sans-serif" font-size="10.5">Тема звернення (Доступно редагування):</text>
    <rect x="20" y="115" width="340" height="30" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="28" y="135" fill="#f8fafc" font-family="sans-serif" font-size="11.5">Уточнення параметрів доступу до API</text>

    <!-- Response / Comment Box -->
    <text x="20" y="165" fill="#94a3b8" font-family="sans-serif" font-size="10.5">Ваша відповідь інженеру:</text>
    <rect x="20" y="175" width="340" height="65" rx="6" fill="#0f172a" stroke="#3b82f6" stroke-width="1.2"/>
    <text x="28" y="196" fill="#cbd5e1" font-family="sans-serif" font-size="11">«Ключ до тестового шлюзу згенеровано.</text>
    <text x="28" y="213" fill="#cbd5e1" font-family="sans-serif" font-size="11">API_SECRET: live_test_77812903»</text>

    <!-- Return to Support Button -->
    <rect x="20" y="255" width="340" height="48" rx="8" fill="#2563eb" stroke="#3b82f6" stroke-width="1.5"/>
    <circle cx="45" cy="279" r="14" fill="#3b82f6"/>
    <text x="45" y="284" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">✓</text>
    <text x="70" y="276" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold">Повернути в підтримку</text>
    <text x="70" y="292" fill="#bfdbfe" font-family="sans-serif" font-size="10">Статус: IN_PROGRESS · Виконавець: Інженер сервісу</text>

    <!-- Footer Security Notice -->
    <rect x="20" y="320" width="340" height="55" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="30" y="340" fill="#94a3b8" font-family="sans-serif" font-size="10">🔒 Безпека та ізоляція:</text>
    <text x="30" y="356" fill="#64748b" font-family="sans-serif" font-size="9.5">Клієнт бачить лише звернення своєї організації.</text>
    <text x="30" y="369" fill="#64748b" font-family="sans-serif" font-size="9.5">Внутрішні логи часу та технічні поля приховані.</text>

    <!-- Callout 2 & 3 -->
    <circle cx="345" cy="255" r="11" fill="#10b981"/>
    <text x="345" y="259" fill="#fff" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">❷</text>
  </g>
</svg>
