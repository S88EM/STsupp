services:
  stsup:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stsup-local
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - stdata:/data
    environment:
      PORT: 3000
      NEXTAUTH_SECRET: "stsup_local_secret_key"
      NEXTAUTH_URL: "http://localhost:3000"
      ADMIN_EMAIL: "admin@stsup.local"
      ADMIN_PASSWORD: "Gorik555"
      ADMIN_NAME: "Євген"

volumes:
  stdata:
