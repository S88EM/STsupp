<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 520" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="shadow4" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="920" height="520" fill="url(#bgGrad4)"/>
  <rect x="20" y="20" width="880" height="480" rx="16" fill="none" stroke="#334155" stroke-width="1.5"/>

  <!-- Window Header -->
  <path d="M 20 36 A 16 16 0 0 1 36 20 L 884 20 A 16 16 0 0 1 900 36 L 900 60 L 20 60 Z" fill="#1e293b"/>
  <circle cx="45" cy="40" r="5" fill="#ef4444"/>
  <circle cx="62" cy="40" r="5" fill="#f59e0b"/>
  <circle cx="79" cy="40" r="5" fill="#10b981"/>
  <text x="460" y="44" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="12" font-weight="600" text-anchor="middle">STsup — Робота з полями картки задачі (Jira Issue Detail View)</text>

  <!-- MAIN 2-COLUMN VIEW IN ISSUE DETAILS -->
  <!-- Left Side: Main Content (Title, Description, Comments) -->
  <g transform="translate(45, 80)">
    <rect width="530" height="400" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5" filter="url(#shadow4)"/>

    <!-- Breadcrumb & Code -->
    <text x="25" y="32" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11">RIGA / RIGA-2</text>
    
    <!-- Title / Summary Editing Area -->
    <rect x="20" y="45" width="490" height="48" rx="8" fill="#0f172a" stroke="#3b82f6" stroke-width="1.2"/>
    <text x="35" y="74" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="14" font-weight="bold">Оптимізація запитів PostgreSQL та налаштування індексів</text>
    <text x="480" y="74" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="14">✎</text>

    <!-- Callout 1: Title -->
    <rect x="15" y="40" width="500" height="58" rx="10" fill="none" stroke="#f43f5e" stroke-width="2" stroke-dasharray="5 3"/>
    <circle cx="520" cy="45" r="11" fill="#f43f5e"/>
    <text x="520" y="49" fill="#ffffff" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">1</text>

    <!-- Description Block -->
    <text x="25" y="125" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11" font-weight="bold">ОПИС ЗАДАЧІ (DESCRIPTION):</text>
    <rect x="20" y="135" width="490" height="150" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    
    <text x="35" y="160" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11" font-weight="500">Необхідно провести аудит повільних SQL-запитів до таблиці Task.</text>
    <text x="35" y="180" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="10.5">• Додати складений індекс на поля (projectId, columnId, orderIndex).</text>
    <text x="35" y="198" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="10.5">• Перевірити час відповіді /api/tasks під навантаженням &gt; 1000 запитів.</text>
    <text x="35" y="216" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="10.5">• Оновити документацію схеми в Confluence.</text>

    <!-- Markdown formatting toolbar -->
    <rect x="25" y="245" width="480" height="28" rx="5" fill="#1e293b"/>
    <text x="40" y="263" fill="#cbd5e1" font-family="monospace" font-size="10" font-weight="bold">B</text>
    <text x="65" y="263" fill="#cbd5e1" font-family="monospace" font-size="10" font-style="italic">I</text>
    <text x="90" y="263" fill="#cbd5e1" font-family="monospace" font-size="10">&lt;/&gt;</text>
    <text x="120" y="263" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="10">• Список</text>
    <rect x="420" y="249" width="75" height="20" rx="4" fill="#2563eb"/>
    <text x="457" y="263" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="9" font-weight="bold" text-anchor="middle">Зберегти</text>

    <!-- Callout 2: Description -->
    <rect x="15" y="130" width="500" height="160" rx="10" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="5 3"/>
    <circle cx="520" cy="135" r="11" fill="#38bdf8"/>
    <text x="520" y="139" fill="#0f172a" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">2</text>

    <!-- Activity Subtasks preview -->
    <text x="25" y="315" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11" font-weight="bold">ПІДЗАДАЧІ (SUBTASKS): 2 з 3 виконано</text>
    <rect x="20" y="325" width="490" height="60" rx="6" fill="#0f172a" stroke="#334155" stroke-width="0.8"/>
    <text x="35" y="348" fill="#10b981" font-family="monospace" font-size="11">✓ Додавання індексів у Prisma Schema</text>
    <text x="35" y="370" fill="#cbd5e1" font-family="monospace" font-size="11">☐ Навантажувальне тестування k6</text>
  </g>

  <!-- Right Side: Sidebar Meta Fields (Components, Labels, Priority) -->
  <g transform="translate(595, 80)">
    <rect width="280" height="400" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5" filter="url(#shadow4)"/>
    
    <text x="20" y="30" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="12" font-weight="bold">МЕТАДАНІ ТА СВОЙСТВА</text>
    <line x1="20" y1="42" x2="260" y2="42" stroke="#334155" stroke-width="1"/>

    <!-- 1. Priority Selector -->
    <text x="20" y="65" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="10" font-weight="600">ПРІОРИТЕТ</text>
    <rect x="20" y="73" width="240" height="32" rx="6" fill="#0f172a" stroke="#f59e0b" stroke-width="1.2"/>
    <text x="32" y="93" fill="#f59e0b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="12">▲ Високий (High)</text>
    <polygon points="242,86 248,94 254,86" fill="#94a3b8"/>

    <!-- 2. Components Selector -->
    <text x="20" y="130" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="10" font-weight="600">КОМПОНЕНТИ (COMPONENTS)</text>
    <rect x="20" y="138" width="240" height="60" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <!-- Component badges -->
    <rect x="28" y="146" width="70" height="20" rx="4" fill="#3b82f6" fill-opacity="0.2" stroke="#3b82f6" stroke-width="0.8"/>
    <text x="63" y="160" fill="#38bdf8" font-family="monospace" font-size="9" text-anchor="middle">DB-Core ✕</text>

    <rect x="105" y="146" width="95" height="20" rx="4" fill="#3b82f6" fill-opacity="0.2" stroke="#3b82f6" stroke-width="0.8"/>
    <text x="152" y="160" fill="#38bdf8" font-family="monospace" font-size="9" text-anchor="middle">API-Backend ✕</text>

    <text x="28" y="186" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="9">+ Додати компонент...</text>

    <!-- 3. Labels Selector -->
    <text x="20" y="224" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="10" font-weight="600">МІТКИ (LABELS)</text>
    <rect x="20" y="232" width="240" height="56" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <!-- Label tags -->
    <rect x="28" y="240" width="85" height="20" rx="10" fill="#8b5cf6" fill-opacity="0.2" stroke="#8b5cf6" stroke-width="0.8"/>
    <text x="70" y="254" fill="#c084fc" font-family="monospace" font-size="9" text-anchor="middle">#optimization ✕</text>

    <rect x="120" y="240" width="75" height="20" rx="10" fill="#8b5cf6" fill-opacity="0.2" stroke="#8b5cf6" stroke-width="0.8"/>
    <text x="157" y="254" fill="#c084fc" font-family="monospace" font-size="9" text-anchor="middle">#postgres ✕</text>

    <text x="28" y="276" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="9">+ Додати мітку...</text>

    <!-- Callout 3: Meta fields -->
    <rect x="12" y="120" width="255" height="175" rx="10" fill="none" stroke="#10b981" stroke-width="2" stroke-dasharray="5 3"/>
    <circle cx="268" cy="125" r="11" fill="#10b981"/>
    <text x="268" y="129" fill="#0f172a" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">3</text>

    <!-- Assignee & Reporter Summary -->
    <text x="20" y="320" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="10" font-weight="600">ВИКОНАВЕЦЬ</text>
    <text x="20" y="338" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11" font-weight="bold">👤 Ігор М. (Інженер)</text>

    <text x="20" y="365" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="10" font-weight="600">АВТОР (REPORTER)</text>
    <text x="20" y="383" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11">✉ client@keenetic.link</text>
  </g>
</svg>
