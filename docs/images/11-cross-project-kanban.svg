<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad11" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="colGrad11" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="shadow11" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="900" height="520" fill="url(#bgGrad11)"/>
  <rect x="20" y="20" width="860" height="480" rx="14" fill="none" stroke="#334155" stroke-width="1.5"/>

  <!-- Window Header -->
  <path d="M 20 34 A 14 14 0 0 1 34 20 L 866 20 A 14 14 0 0 1 880 34 L 880 58 L 20 58 Z" fill="#1e293b"/>
  <circle cx="45" cy="39" r="5" fill="#ef4444"/>
  <circle cx="62" cy="39" r="5" fill="#f59e0b"/>
  <circle cx="79" cy="39" r="5" fill="#10b981"/>
  <text x="450" y="43" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">STsup — Крос-проєктна Kanban-дошка (/boards) та взаємодія Drag-and-Drop</text>

  <!-- TOP BAR / FILTERS -->
  <g transform="translate(35, 68)">
    <text x="0" y="18" fill="#f8fafc" font-family="sans-serif" font-size="14" font-weight="bold">Загальна Kanban-дошка</text>
    
    <!-- Filter: Project -->
    <rect x="200" y="0" width="130" height="26" rx="5" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="210" y="17" fill="#cbd5e1" font-family="sans-serif" font-size="10.5">Всі проєкти ▾</text>

    <!-- Filter: Assignee -->
    <rect x="340" y="0" width="120" height="26" rx="5" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="350" y="17" fill="#cbd5e1" font-family="sans-serif" font-size="10.5">Всі виконавці ▾</text>

    <!-- Search Input -->
    <rect x="470" y="0" width="160" height="26" rx="5" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="482" y="17" fill="#64748b" font-family="sans-serif" font-size="10.5">🔍 Пошук задач...</text>

    <!-- Total Task Count -->
    <rect x="740" y="0" width="90" height="26" rx="5" fill="#3b82f6" fill-opacity="0.15" stroke="#3b82f6" stroke-width="1"/>
    <text x="785" y="17" fill="#38bdf8" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Всього: 18</text>
  </g>

  <!-- KANBAN COLUMNS -->
  <!-- COLUMN 1: БЕКЛОГ -->
  <g transform="translate(35, 105)">
    <rect width="195" height="380" rx="8" fill="url(#colGrad11)" stroke="#334155" stroke-width="1"/>
    <rect width="195" height="32" rx="8" fill="#1e293b"/>
    <text x="12" y="21" fill="#94a3b8" font-family="sans-serif" font-size="11" font-weight="bold">БЕКЛОГ</text>
    <rect x="160" y="8" width="22" height="16" rx="4" fill="#334155"/>
    <text x="171" y="20" fill="#cbd5e1" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">4</text>

    <!-- Card 1 in Backlog -->
    <rect x="8" y="42" width="179" height="74" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="18" y="60" fill="#38bdf8" font-family="monospace" font-size="10" font-weight="bold">CORE-12</text>
    <circle cx="170" cy="56" r="4" fill="#3b82f6"/>
    <text x="18" y="77" fill="#f8fafc" font-family="sans-serif" font-size="10.5" font-weight="500">Оптимізація SQL індексів</text>
    <rect x="18" y="90" width="35" height="16" rx="3" fill="#1e293b"/>
    <text x="35" y="102" fill="#94a3b8" font-family="sans-serif" font-size="9" text-anchor="middle">4h</text>
    <circle cx="168" cy="98" r="8" fill="#6366f1"/>
    <text x="168" y="102" fill="#fff" font-family="sans-serif" font-size="8" font-weight="bold" text-anchor="middle">МК</text>

    <!-- Card 2 in Backlog -->
    <rect x="8" y="124" width="179" height="74" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="18" y="142" fill="#38bdf8" font-family="monospace" font-size="10" font-weight="bold">RIGA-5</text>
    <circle cx="170" cy="138" r="4" fill="#f59e0b"/>
    <text x="18" y="159" fill="#f8fafc" font-family="sans-serif" font-size="10.5" font-weight="500">Оновлення сертифіката SSL</text>
    <rect x="18" y="172" width="35" height="16" rx="3" fill="#1e293b"/>
    <text x="35" y="184" fill="#94a3b8" font-family="sans-serif" font-size="9" text-anchor="middle">2h</text>
    <circle cx="168" cy="180" r="8" fill="#10b981"/>
    <text x="168" y="184" fill="#fff" font-family="sans-serif" font-size="8" font-weight="bold" text-anchor="middle">ОС</text>
  </g>

  <!-- COLUMN 2: В РОБОТІ -->
  <g transform="translate(245, 105)">
    <rect width="195" height="380" rx="8" fill="url(#colGrad11)" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.7"/>
    <rect width="195" height="32" rx="8" fill="#1e293b"/>
    <text x="12" y="21" fill="#38bdf8" font-family="sans-serif" font-size="11" font-weight="bold">В РОБОТІ</text>
    <rect x="160" y="8" width="22" height="16" rx="4" fill="#0284c7" fill-opacity="0.3"/>
    <text x="171" y="20" fill="#38bdf8" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">3</text>

    <!-- Source card original place (dimmed placeholder / picked up) -->
    <rect x="8" y="42" width="179" height="74" rx="6" fill="#0f172a" fill-opacity="0.3" stroke="#334155" stroke-width="1" stroke-dasharray="3 3"/>
    <text x="97" y="82" fill="#475569" font-family="sans-serif" font-size="10" text-anchor="middle">[Перетягується]</text>

    <!-- Card in In Progress -->
    <rect x="8" y="124" width="179" height="74" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="18" y="142" fill="#38bdf8" font-family="monospace" font-size="10" font-weight="bold">CORE-8</text>
    <circle cx="170" cy="138" r="4" fill="#ef4444"/>
    <text x="18" y="159" fill="#f8fafc" font-family="sans-serif" font-size="10.5" font-weight="500">Автоматизація звітів SLA</text>
    <rect x="18" y="172" width="35" height="16" rx="3" fill="#1e293b"/>
    <text x="35" y="184" fill="#94a3b8" font-family="sans-serif" font-size="9" text-anchor="middle">1d</text>
    <circle cx="168" cy="180" r="8" fill="#f59e0b"/>
    <text x="168" y="184" fill="#fff" font-family="sans-serif" font-size="8" font-weight="bold" text-anchor="middle">ІВ</text>
  </g>

  <!-- COLUMN 3: ТЕСТУВАННЯ (TARGET DROP ZONE) -->
  <g transform="translate(455, 105)">
    <rect width="195" height="380" rx="8" fill="url(#colGrad11)" stroke="#334155" stroke-width="1"/>
    <rect width="195" height="32" rx="8" fill="#1e293b"/>
    <text x="12" y="21" fill="#f59e0b" font-family="sans-serif" font-size="11" font-weight="bold">ТЕСТУВАННЯ</text>
    <rect x="160" y="8" width="22" height="16" rx="4" fill="#334155"/>
    <text x="171" y="20" fill="#cbd5e1" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">2</text>

    <!-- ACTIVE DROP PLACEHOLDER -->
    <rect x="8" y="42" width="179" height="74" rx="6" fill="#38bdf8" fill-opacity="0.1" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 4"/>
    <text x="97" y="75" fill="#38bdf8" font-family="sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle">▼ Місце скидання (Drop)</text>
    <text x="97" y="93" fill="#93c5fd" font-family="sans-serif" font-size="9" text-anchor="middle">Відпустіть клавішу миші</text>

    <!-- Existing Card in Testing -->
    <rect x="8" y="124" width="179" height="74" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="18" y="142" fill="#38bdf8" font-family="monospace" font-size="10" font-weight="bold">RIGA-3</text>
    <circle cx="170" cy="138" r="4" fill="#3b82f6"/>
    <text x="18" y="159" fill="#f8fafc" font-family="sans-serif" font-size="10.5" font-weight="500">Перевірка прав доступу</text>
    <rect x="18" y="172" width="35" height="16" rx="3" fill="#1e293b"/>
    <text x="35" y="184" fill="#94a3b8" font-family="sans-serif" font-size="9" text-anchor="middle">3h</text>
    <circle cx="168" cy="180" r="8" fill="#a855f7"/>
    <text x="168" y="184" fill="#fff" font-family="sans-serif" font-size="8" font-weight="bold" text-anchor="middle">ТВ</text>
  </g>

  <!-- COLUMN 4: ГОТОВО -->
  <g transform="translate(665, 105)">
    <rect width="195" height="380" rx="8" fill="url(#colGrad11)" stroke="#334155" stroke-width="1"/>
    <rect width="195" height="32" rx="8" fill="#1e293b"/>
    <text x="12" y="21" fill="#10b981" font-family="sans-serif" font-size="11" font-weight="bold">ГОТОВО</text>
    <rect x="160" y="8" width="22" height="16" rx="4" fill="#10b981" fill-opacity="0.2"/>
    <text x="171" y="20" fill="#10b981" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">9</text>

    <!-- Card in Done -->
    <rect x="8" y="42" width="179" height="74" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="18" y="60" fill="#10b981" font-family="monospace" font-size="10" font-weight="bold">RIGA-1</text>
    <circle cx="170" cy="56" r="4" fill="#10b981"/>
    <text x="18" y="77" fill="#94a3b8" font-family="sans-serif" font-size="10.5" font-weight="500" text-decoration="line-through">Підключення користувача</text>
    <rect x="18" y="90" width="35" height="16" rx="3" fill="#1e293b"/>
    <text x="35" y="102" fill="#10b981" font-family="sans-serif" font-size="9" text-anchor="middle">✓</text>
  </g>

  <!-- FLOATING DRAG PREVIEW (PORTAL TO BODY) -->
  <g transform="translate(370, 160) rotate(2)" filter="url(#shadow11)">
    <!-- High-elevation floating card -->
    <rect width="186" height="78" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="16" y="24" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="bold">RIGA-2</text>
    <circle cx="168" cy="20" r="5" fill="#ef4444"/>
    <text x="16" y="44" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold">Уточнення доступу API</text>
    <rect x="16" y="54" width="42" height="18" rx="3" fill="#0f172a"/>
    <text x="37" y="67" fill="#38bdf8" font-family="sans-serif" font-size="9.5" text-anchor="middle">3d</text>
    <circle cx="166" cy="62" r="9" fill="#0284c7"/>
    <text x="166" y="66" fill="#fff" font-family="sans-serif" font-size="9" font-weight="bold" text-anchor="middle">ВБ</text>

    <!-- Cursor Pointer -->
    <polygon points="120,40 120,60 125,55 133,68 137,66 129,52 136,52" fill="#ffffff" stroke="#000" stroke-width="1.5"/>
  </g>

  <!-- CALLOUT BADGES ❶, ❷, ❸ -->
  <!-- Callout 1: Portal render -->
  <circle cx="360" cy="155" r="12" fill="#ef4444"/>
  <text x="360" y="160" fill="#fff" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">❶</text>
  <rect x="250" y="255" width="230" height="40" rx="6" fill="#0f172a" stroke="#ef4444" stroke-width="1.2"/>
  <text x="260" y="272" fill="#fca5a5" font-family="sans-serif" font-size="10" font-weight="bold">❶ React Portal (document.body):</text>
  <text x="260" y="286" fill="#cbd5e1" font-family="sans-serif" font-size="9.5">Прев'ю слідує за курсором без зміщень.</text>

  <!-- Callout 2: Drop Placeholder -->
  <circle cx="480" cy="200" r="12" fill="#38bdf8"/>
  <text x="480" y="205" fill="#fff" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">❷</text>
  <rect x="490" y="255" width="230" height="40" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2"/>
  <text x="500" y="272" fill="#93c5fd" font-family="sans-serif" font-size="10" font-weight="bold">❷ Drop Placeholder:</text>
  <text x="500" y="286" fill="#cbd5e1" font-family="sans-serif" font-size="9.5">Пунктир вказує на точну позицію вставки.</text>
</svg>
