<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad7" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="shadow7" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="920" height="500" fill="url(#bgGrad7)"/>
  <rect x="20" y="20" width="880" height="460" rx="16" fill="none" stroke="#334155" stroke-width="1.5"/>

  <!-- Window Header -->
  <path d="M 20 36 A 16 16 0 0 1 36 20 L 884 20 A 16 16 0 0 1 900 36 L 900 60 L 20 60 Z" fill="#1e293b"/>
  <circle cx="45" cy="40" r="5" fill="#ef4444"/>
  <circle cx="62" cy="40" r="5" fill="#f59e0b"/>
  <circle cx="79" cy="40" r="5" fill="#10b981"/>
  <text x="460" y="44" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="12" font-weight="600" text-anchor="middle">STsup — Швидка дія «Повернути до клієнта» в один клік</text>

  <!-- ACTION BAR IN HEADER -->
  <g transform="translate(50, 80)">
    <rect width="820" height="70" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5" filter="url(#shadow7)"/>

    <!-- Left breadcrumb -->
    <text x="25" y="40" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="12">ST / ST-14 / <tspan fill="#f8fafc" font-weight="bold">Налаштування шлюзу Keenetic</tspan></text>

    <!-- Right Quick Actions -->
    <g transform="translate(420, 16)">
      <!-- Comment button -->
      <rect x="0" y="0" width="100" height="36" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="50" y="22" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11" text-anchor="middle">💬 Коментар</text>

      <!-- THE FEATURED BUTTON: Return to Client -->
      <rect x="115" y="0" width="180" height="36" rx="6" fill="#f59e0b" fill-opacity="0.2" stroke="#f59e0b" stroke-width="1.5"/>
      <text x="205" y="22" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11" font-weight="bold" text-anchor="middle">↩ Повернути до клієнта</text>

      <!-- More Menu -->
      <rect x="310" y="0" width="70" height="36" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="345" y="22" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11" text-anchor="middle">Ще ▾</text>

      <!-- Callout 1: Return Button -->
      <rect x="110" y="-5" width="190" height="46" rx="8" fill="none" stroke="#f43f5e" stroke-width="2" stroke-dasharray="5 3"/>
      <circle cx="305" cy="-2" r="11" fill="#f43f5e"/>
      <text x="305" y="2" fill="#ffffff" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">1</text>
    </g>
  </g>

  <!-- WORKFLOW AUTOMATION FLOWCHART -->
  <g transform="translate(50, 180)">
    <rect width="820" height="270" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5" filter="url(#shadow7)"/>
    
    <text x="25" y="32" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="13" font-weight="bold">Автоматичний ланцюг обробки швидкої дії:</text>

    <!-- Node 1: Current State -->
    <g transform="translate(30, 60)">
      <rect width="210" height="150" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.2"/>
      <rect x="15" y="15" width="180" height="26" rx="5" fill="#3b82f6" fill-opacity="0.2"/>
      <text x="105" y="32" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11" font-weight="bold" text-anchor="middle">СТАН: В РОБОТІ В ІНЖЕНЕРА</text>

      <text x="15" y="65" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="10.5">Виконавець: <tspan fill="#f8fafc" font-weight="bold">Ігор М. (Інженер)</tspan></text>
      <text x="15" y="85" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="10.5">Автор: <tspan fill="#f8fafc">client@keenetic.link</tspan></text>
      <text x="15" y="115" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="10">Інженер завершив роботу або потрібні додаткові дані від клієнта.</text>
    </g>

    <!-- Flow Arrow 1 -->
    <g transform="translate(255, 135)">
      <line x1="0" y1="0" x2="35" y2="0" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="5 3"/>
      <polygon points="35,-6 45,0 35,6" fill="#f59e0b"/>
      <text x="22" y="-10" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="9" font-weight="bold" text-anchor="middle">1 Клік</text>
    </g>

    <!-- Node 2: System Action -->
    <g transform="translate(315, 60)">
      <rect width="220" height="150" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
      <rect x="15" y="15" width="190" height="26" rx="5" fill="#f59e0b" fill-opacity="0.2"/>
      <text x="110" y="32" fill="#f59e0b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11" font-weight="bold" text-anchor="middle">СИСТЕМНА АВТОМАТИЗАЦІЯ</text>

      <text x="15" y="65" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="10.5">1. Пошук creatorId (Reporter).</text>
      <text x="15" y="85" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="10.5">2. Перепризначення задачі.</text>
      <text x="15" y="105" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="10.5">3. Запис у таблицю AuditLog.</text>
      <text x="15" y="125" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="10.5">4. Відправка Email та Telegram.</text>

      <!-- Callout 2: Automation -->
      <circle cx="215" cy="18" r="10" fill="#f43f5e"/>
      <text x="215" y="22" fill="#ffffff" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">2</text>
    </g>

    <!-- Flow Arrow 2 -->
    <g transform="translate(550, 135)">
      <line x1="0" y1="0" x2="35" y2="0" stroke="#10b981" stroke-width="2.5" stroke-dasharray="5 3"/>
      <polygon points="35,-6 45,0 35,6" fill="#10b981"/>
      <text x="22" y="-10" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="9" font-weight="bold" text-anchor="middle">Готово</text>
    </g>

    <!-- Node 3: Resulting State -->
    <g transform="translate(600, 60)">
      <rect width="195" height="150" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="1.2"/>
      <rect x="15" y="15" width="165" height="26" rx="5" fill="#10b981" fill-opacity="0.2"/>
      <text x="97" y="32" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11" font-weight="bold" text-anchor="middle">РЕЗУЛЬТАТ У КЛІЄНТА</text>

      <text x="15" y="65" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="10.5">Новий виконавець: <tspan fill="#34d399" font-weight="bold">Клієнт</tspan></text>
      <text x="15" y="90" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="10">У клієнтському порталі з'являється плашка:</text>
      <rect x="15" y="105" width="165" height="32" rx="4" fill="#0f172a" stroke="#eab308" stroke-width="1"/>
      <text x="97" y="125" fill="#facc15" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="9.5" font-weight="bold" text-anchor="middle">🔔 Очікує вашої відповіді</text>

      <!-- Callout 3: Client Notification -->
      <circle cx="190" cy="18" r="10" fill="#10b981"/>
      <text x="190" y="22" fill="#0f172a" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">3</text>
    </g>

    <!-- Footer info -->
    <text x="30" y="240" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="10.5">💡 Захист від помилок: Кнопка стає активною лише тоді, коли поточний виконавець є інженером або адміном, а автор задачі відрізняється від виконавця.</text>
  </g>
</svg>
