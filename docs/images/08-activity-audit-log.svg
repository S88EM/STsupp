<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad8" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="shadow8" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="920" height="500" fill="url(#bgGrad8)"/>
  <rect x="20" y="20" width="880" height="460" rx="16" fill="none" stroke="#334155" stroke-width="1.5"/>

  <!-- Window Header -->
  <path d="M 20 36 A 16 16 0 0 1 36 20 L 884 20 A 16 16 0 0 1 900 36 L 900 60 L 20 60 Z" fill="#1e293b"/>
  <circle cx="45" cy="40" r="5" fill="#ef4444"/>
  <circle cx="62" cy="40" r="5" fill="#f59e0b"/>
  <circle cx="79" cy="40" r="5" fill="#10b981"/>
  <text x="460" y="44" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="12" font-weight="600" text-anchor="middle">STsup — Журнал аудиту та хронологія змін (Audit &amp; Activity Log)</text>

  <!-- ACTIVITY LOG PANE -->
  <g transform="translate(50, 80)">
    <rect width="820" height="375" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5" filter="url(#shadow8)"/>

    <!-- Tabs Header -->
    <g transform="translate(25, 20)">
      <rect x="0" y="0" width="110" height="32" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="55" y="20" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11" text-anchor="middle">💬 Коментарі (4)</text>

      <!-- Active Tab: Audit Log -->
      <rect x="120" y="0" width="150" height="32" rx="6" fill="#2563eb" stroke="#3b82f6" stroke-width="1"/>
      <text x="195" y="20" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11" font-weight="bold" text-anchor="middle">📜 Історія змін (Audit)</text>

      <!-- Callout 1: Tab switcher -->
      <rect x="115" y="-5" width="160" height="42" rx="8" fill="none" stroke="#f43f5e" stroke-width="2" stroke-dasharray="5 3"/>
      <circle cx="280" cy="-2" r="11" fill="#f43f5e"/>
      <text x="280" y="2" fill="#ffffff" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">1</text>
    </g>
    <line x1="25" y1="65" x2="795" y2="65" stroke="#334155" stroke-width="1"/>

    <!-- Chronological Timeline Entries -->
    <!-- Event 1: Status changed -->
    <g transform="translate(45, 80)">
      <circle cx="10" cy="18" r="6" fill="#3b82f6"/>
      <line x1="10" y1="26" x2="10" y2="68" stroke="#334155" stroke-width="2"/>
      
      <rect x="30" y="0" width="720" height="56" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="45" y="22" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11" font-weight="bold">Ігор М. (Інженер) <tspan font-weight="normal" fill="#94a3b8">перевів задачу в статус:</tspan></text>
      <rect x="300" y="8" width="90" height="20" rx="4" fill="#64748b" fill-opacity="0.2"/>
      <text x="345" y="22" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="10" text-anchor="middle">В РОБОТІ</text>
      <text x="400" y="22" fill="#38bdf8" font-family="monospace" font-size="12">→</text>
      <rect x="420" y="8" width="105" height="20" rx="4" fill="#eab308" fill-opacity="0.2" stroke="#eab308" stroke-width="0.8"/>
      <text x="472" y="22" fill="#facc15" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="10" font-weight="bold" text-anchor="middle">ТЕСТУВАННЯ</text>

      <text x="45" y="42" fill="#64748b" font-family="monospace" font-size="10">09.11.2026, 12:40 • Дія: UPDATE_STATUS • IP: 192.168.1.105</text>
    </g>

    <!-- Event 2: Return to Client -->
    <g transform="translate(45, 146)">
      <circle cx="10" cy="18" r="6" fill="#f59e0b"/>
      <line x1="10" y1="26" x2="10" y2="68" stroke="#334155" stroke-width="2"/>

      <rect x="30" y="0" width="720" height="56" rx="8" fill="#0f172a" stroke="#f59e0b" stroke-width="1.2"/>
      <text x="45" y="22" fill="#f59e0b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11" font-weight="bold">↩ ШВИДКА ДІЯ: Повернення до клієнта (RETURN_TO_CLIENT)</text>
      <text x="45" y="42" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="10.5">Виконавця автоматично змінено з <tspan font-weight="bold" fill="#f8fafc">Ігор М.</tspan> на автора звернення <tspan font-weight="bold" fill="#38bdf8">client@keenetic.link</tspan></text>
      <text x="560" y="42" fill="#64748b" font-family="monospace" font-size="10">09.11.2026, 11:55</text>

      <!-- Callout 2: Event Details -->
      <circle cx="740" cy="20" r="10" fill="#f59e0b"/>
      <text x="740" y="24" fill="#0f172a" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">2</text>
    </g>

    <!-- Event 3: Time Estimate Changed -->
    <g transform="translate(45, 212)">
      <circle cx="10" cy="18" r="6" fill="#10b981"/>
      <line x1="10" y1="26" x2="10" y2="68" stroke="#334155" stroke-width="2"/>

      <rect x="30" y="0" width="720" height="56" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="45" y="22" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11" font-weight="bold">Ігор М. (Інженер) <tspan font-weight="normal" fill="#94a3b8">оновив часову оцінку задачі:</tspan></text>
      <text x="320" y="22" fill="#94a3b8" font-family="monospace" font-size="11">2h → <tspan fill="#34d399" font-weight="bold">4h</tspan> (перерахунок залишку та прогрес-бару)</text>

      <text x="45" y="42" fill="#64748b" font-family="monospace" font-size="10">09.11.2026, 11:15 • Дія: UPDATE_ESTIMATE</text>
    </g>

    <!-- Event 4: Task Created -->
    <g transform="translate(45, 278)">
      <circle cx="10" cy="18" r="6" fill="#64748b"/>

      <rect x="30" y="0" width="720" height="56" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="45" y="22" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11" font-weight="bold">client@keenetic.link (Клієнт) <tspan font-weight="normal" fill="#94a3b8">створив нове звернення:</tspan> <tspan fill="#38bdf8" font-family="monospace">ST-14</tspan></text>
      <text x="45" y="42" fill="#64748b" font-family="monospace" font-size="10">09.11.2026, 09:14 • Початковий статус: БЕКЛОГ • Виконавець: не призначено</text>

      <!-- Callout 3: Non-repudiation -->
      <circle cx="740" cy="20" r="10" fill="#10b981"/>
      <text x="740" y="24" fill="#0f172a" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">3</text>
    </g>

    <!-- Security Note -->
    <text x="75" y="358" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="10">🔒 Захист цілісності: Записи в таблиці AuditLog створюються на рівні транзакцій Prisma ORM і не можуть бути видалені чи відредаговані користувачами.</text>
  </g>
</svg>
