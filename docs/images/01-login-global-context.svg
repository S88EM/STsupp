<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="520" fill="url(#bgGrad)"/>
  <rect x="20" y="20" width="860" height="480" rx="16" fill="none" stroke="#334155" stroke-width="1.5"/>

  <!-- Title Bar / Header of Mockup -->
  <path d="M 20 36 A 16 16 0 0 1 36 20 L 864 20 A 16 16 0 0 1 880 36 L 880 60 L 20 60 Z" fill="#1e293b"/>
  <circle cx="45" cy="40" r="5" fill="#ef4444"/>
  <circle cx="62" cy="40" r="5" fill="#f59e0b"/>
  <circle cx="79" cy="40" r="5" fill="#10b981"/>
  <text x="450" y="44" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">STsup — Вхід у систему та автоматичний перехід до робочого простору</text>

  <!-- LEFT PANE: Login Screen Mockup -->
  <g transform="translate(45, 80)">
    <rect width="360" height="400" rx="14" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>
    
    <!-- Logo Badge -->
    <rect x="155" y="30" width="50" height="50" rx="12" fill="#3b82f6" fill-opacity="0.15" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="180" y="61" fill="#38bdf8" font-family="monospace" font-size="20" font-weight="bold" text-anchor="middle">ST</text>

    <text x="180" y="105" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="16" font-weight="bold" text-anchor="middle">Вхід до STsup</text>
    <text x="180" y="125" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11" text-anchor="middle">Service Desk &amp; Agile Task Tracking</text>

    <!-- Email Input -->
    <text x="35" y="160" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11" font-weight="600">Електронна пошта</text>
    <rect x="35" y="170" width="290" height="36" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1.2"/>
    <text x="48" y="193" fill="#e2e8f0" font-family="monospace" font-size="12">admin@stsup.local</text>

    <!-- Password Input -->
    <text x="35" y="230" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11" font-weight="600">Пароль</text>
    <rect x="35" y="240" width="290" height="36" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1.2"/>
    <text x="48" y="264" fill="#94a3b8" font-family="monospace" font-size="14">••••••••••••</text>

    <!-- Submit Button -->
    <rect x="35" y="300" width="290" height="38" rx="8" fill="#2563eb" stroke="#3b82f6" stroke-width="1"/>
    <text x="180" y="324" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="13" font-weight="bold" text-anchor="middle">Увійти в систему →</text>

    <!-- User Roles info -->
    <rect x="35" y="355" width="290" height="28" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="180" y="373" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="10" text-anchor="middle">Підтримувані ролі: ADMIN | ENGINEER | CLIENT</text>

    <!-- Focus Callout 1 -->
    <rect x="25" y="290" width="310" height="58" rx="10" fill="none" stroke="#f43f5e" stroke-width="2" stroke-dasharray="5 3"/>
    <circle cx="340" cy="295" r="12" fill="#f43f5e"/>
    <text x="340" y="300" fill="#ffffff" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">1</text>
  </g>

  <!-- Flow Arrow -->
  <g transform="translate(415, 260)">
    <line x1="0" y1="0" x2="60" y2="0" stroke="#38bdf8" stroke-width="3" stroke-dasharray="6 4"/>
    <polygon points="60,-7 75,0 60,7" fill="#38bdf8"/>
    <rect x="-10" y="-35" width="95" height="20" rx="4" fill="#0369a1"/>
    <text x="37" y="-21" fill="#e0f2fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="9" font-weight="bold" text-anchor="middle">Авто-редирект</text>
  </g>

  <!-- RIGHT PANE: Destination Screen (/projects/all) -->
  <g transform="translate(495, 80)">
    <rect width="360" height="400" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>

    <!-- URL Bar inside Mockup -->
    <rect x="15" y="15" width="330" height="28" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="25" y="33" fill="#10b981" font-family="monospace" font-size="10">https://jira.pijon.keenetic.link/projects/all</text>

    <!-- Header bar -->
    <rect x="15" y="52" width="330" height="42" rx="6" fill="#1e293b"/>
    <rect x="25" y="62" width="85" height="22" rx="4" fill="#3b82f6" fill-opacity="0.2" stroke="#3b82f6" stroke-width="1"/>
    <text x="67" y="77" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="10" font-weight="bold" text-anchor="middle">Всі проєкти ▼</text>
    <rect x="250" y="62" width="85" height="22" rx="4" fill="#2563eb"/>
    <text x="292" y="77" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="9" font-weight="bold" text-anchor="middle">+ Створити</text>

    <!-- Mini 3-Panel Preview -->
    <!-- Left Sidebar -->
    <rect x="15" y="102" width="70" height="280" rx="4" fill="#1e293b" stroke="#334155" stroke-width="0.8"/>
    <text x="22" y="125" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="9" font-weight="bold">НАВІГАЦІЯ</text>
    <rect x="18" y="135" width="64" height="18" rx="3" fill="#3b82f6" fill-opacity="0.2"/>
    <text x="24" y="147" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="8" font-weight="bold">• Задачі</text>
    <text x="24" y="167" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="8">Канбан</text>
    <text x="24" y="185" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="8">Беклог</text>

    <!-- Center Issue List -->
    <rect x="90" y="102" width="115" height="280" rx="4" fill="#1e293b" stroke="#334155" stroke-width="0.8"/>
    <text x="96" y="122" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="8" font-weight="bold">РЕЄСТР ЗАДАЧ</text>

    <!-- Task Item 1 -->
    <rect x="95" y="132" width="105" height="42" rx="4" fill="#0f172a" stroke="#3b82f6" stroke-width="1.2"/>
    <text x="100" y="145" fill="#38bdf8" font-family="monospace" font-size="8" font-weight="bold">RIGA-2</text>
    <text x="100" y="160" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="8">Оптимізація бази...</text>

    <!-- Task Item 2 -->
    <rect x="95" y="180" width="105" height="42" rx="4" fill="#0f172a" stroke="#334155" stroke-width="0.8"/>
    <text x="100" y="193" fill="#64748b" font-family="monospace" font-size="8">CORE-14</text>
    <text x="100" y="208" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="8">Інтеграція SMTP...</text>

    <!-- Task Item 3 -->
    <rect x="95" y="228" width="105" height="42" rx="4" fill="#0f172a" stroke="#334155" stroke-width="0.8"/>
    <text x="100" y="241" fill="#64748b" font-family="monospace" font-size="8">ST-5</text>
    <text x="100" y="256" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="8">Оновлення шлюзу...</text>

    <!-- Right Task Details -->
    <rect x="210" y="102" width="135" height="280" rx="4" fill="#1e293b" stroke="#334155" stroke-width="0.8"/>
    <text x="218" y="122" fill="#38bdf8" font-family="monospace" font-size="9" font-weight="bold">RIGA-2</text>
    <text x="218" y="138" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="9" font-weight="bold">Оптимізація бази</text>
    <rect x="218" y="150" width="60" height="16" rx="3" fill="#3b82f6" fill-opacity="0.2" stroke="#3b82f6" stroke-width="0.8"/>
    <text x="248" y="162" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="8" font-weight="bold" text-anchor="middle">В роботі</text>
    <text x="218" y="185" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="8">Оцінка: 4h</text>
    <text x="218" y="200" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="8">Витрачено: 1h 30m</text>

    <!-- Focus Callout 2 -->
    <rect x="10" y="10" width="340" height="38" rx="8" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="5 3"/>
    <circle cx="355" cy="15" r="12" fill="#38bdf8"/>
    <text x="355" y="20" fill="#0f172a" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">2</text>

    <!-- Focus Callout 3 -->
    <rect x="88" y="98" width="260" height="290" rx="8" fill="none" stroke="#10b981" stroke-width="2" stroke-dasharray="5 3"/>
    <circle cx="355" cy="380" r="12" fill="#10b981"/>
    <text x="355" y="385" fill="#0f172a" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">3</text>
  </g>
</svg>
