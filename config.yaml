name: "STsup"
slug: "stsup"
version: "0.3.8"
description: "Швидкий Kanban-трекер задач у стилі Linear із гнучкими статусами, авторизацією та підтримкою AI Confluence"
url: "https://github.com/S88EM/STsupp"
arch:
  - aarch64
  - amd64
  - armv7
startup: services
boot: auto
init: false
webui: "http://[HOST]:[PORT:3000]"
ports:
  3000/tcp: 3000
ports_description:
  3000/tcp: "Веб-інтерфейс STsup"
map:
  - share:rw
options:
  timezone: "Europe/Kyiv"
  app_url: ""
  admin_email: "admin@stsup.local"
  admin_password: ""
  smtp_host: ""
  smtp_port: 587
  smtp_secure: false
  smtp_user: ""
  smtp_password: ""
  smtp_from: "STsup <no-reply@stsup.local>"
  telegram_bot_token: ""
  telegram_chat_id: ""
  telegram_enabled: false
schema:
  timezone: str
  app_url: str?
  admin_email: email?
  admin_password: password?
  smtp_host: str?
  smtp_port: int?
  smtp_secure: bool?
  smtp_user: str?
  smtp_password: password?
  smtp_from: str?
  telegram_bot_token: password?
  telegram_chat_id: str?
  telegram_enabled: bool?
